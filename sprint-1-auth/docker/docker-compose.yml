version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: eventhub-db
    restart: always
    environment:
      POSTGRES_USER: eventhub_admin
      POSTGRES_PASSWORD: super-secure-db-password-2026
      POSTGRES_DB: eventhub_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migration.sql:/docker-entrypoint-initdb.d/migration.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhub_admin -d eventhub_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Caching & Blacklist Service
  redis:
    image: redis:7-alpine
    container_name: eventhub-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. NestJS Backend API Service
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: eventhub-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://eventhub_admin:super-secure-db-password-2026@postgres:5432/eventhub_saas?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: super-secret-access-key-2026
      JWT_REFRESH_SECRET: super-secret-refresh-key-2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Next.js Frontend Web Client
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: eventhub-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://backend:5000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
